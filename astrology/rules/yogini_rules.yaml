- rule_id: YOGINI_CAREER_D10_001
  system: Yogini
  chart: D10
  dasha: Yogini
  category: career
  condition:
    path: yogini.yogini_lord_facts.d10.house
    operator: in
    value: [2, 6, 10, 11]
  reason: Current Yogini lord connects to career/income houses in D10.
  interpretation: Yogini lord placement in D10 career houses supports professional timing when other systems agree.
