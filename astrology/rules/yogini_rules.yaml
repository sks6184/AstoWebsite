- rule_id: YOGINI_ACTIVE_001
  system: Yogini
  dasha: Yogini
  category: general
  condition:
    path: yogini.calculation_status
    operator: equals
    value: active
  reason: Yogini Dasha calculation is active.
  interpretation: Yogini can now be used as a fourth timing-verification system along with Vimshottari, Jaimini, and Varga evidence.
  outcomes:
    delay_score: 0
  weight: 1
  polarity: positive
  confidence: high
  source_book: "Applications of Yogini Dasha for Brilliant Predictions"
  source_chapter: "Calculation of Yogini Dasha"
  source_page: "pp. 8-21 / PDF pages 16-29"

- rule_id: YOGINI_CAREER_SUPPORT_001
  system: Yogini
  dasha: Yogini
  category: career
  condition:
    path: yogini.status
    operator: equals
    value: supports
  reason: Current Yogini timing supports the question category.
  interpretation: Yogini timing increases confidence when the current major or subperiod lord connects to the relevant houses.
  outcomes:
    promotion_score: 2
    job_change_score: 1
    income_growth_score: 1
  weight: 5
  polarity: positive
  confidence: medium
  source_book: "Applications of Yogini Dasha for Brilliant Predictions"
  source_chapter: "Calculation of Yogini Dasha"
  source_page: "pp. 8-21 / PDF pages 16-29"

