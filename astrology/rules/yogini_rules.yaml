- rule_id: YOGINI_MIXED_001
  system: Yogini
  dasha: Yogini
  category: general
  condition:
    path: yogini.status
    operator: equals
    value: mixed
  reason: Yogini gives only partial confirmation.
  interpretation: Mixed Yogini timing should reduce certainty or be described as partial support rather than a strong confirmation.
  outcomes:
    risk_score: 1
    delay_score: 1
  weight: 3
  polarity: mixed
  confidence: medium
  source_book: "Applications of Yogini Dasha for Brilliant Predictions"
  source_chapter: "Calculation of Yogini Dasha"
  source_page: "pp. 8-21 / PDF pages 16-29"
