- rule_id: VIMSHOTTARI_CH24_MD_AD_TRINAL_EXCHANGE_SUPPORT_001
  system: Parashari/Vimshottari
  dasha: Vimshottari
  category: general
  condition:
    any:
      - all:
          - path: parashari_vimshottari.current_mahadasha_lord_facts.owned_houses
            operator: equals
            value: 5
          - path: parashari_vimshottari.current_antardasha_lord_facts.owned_houses
            operator: equals
            value: 9
      - all:
          - path: parashari_vimshottari.current_mahadasha_lord_facts.owned_houses
            operator: equals
            value: 9
          - path: parashari_vimshottari.current_antardasha_lord_facts.owned_houses
            operator: equals
            value: 5
  reason: Current Mahadasha and Antardasha connect the 5th and 9th lords.
  interpretation: The sub-period of the 5th lord in the period of the 9th lord, or the reverse, is treated as favorable and can support merit, guidance, fortune, and smoother outcomes.
  outcomes:
    promotion_score: 2
    authority_score: 2
    income_growth_score: 1
    business_success_score: 1
    long_term_sustainability_score: 1
    delay_score: -1
  weight: 7
  polarity: positive
  confidence: medium
  source_book: "Hindu Predictive Astrology - B. V. Raman"
  source_chapter: "Chapter XXIV: Results of Dasas and Bhuktis"
  source_page: "p. 143"

