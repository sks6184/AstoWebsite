- rule_id: VIMSHOTTARI_CH24_LAGNA_LORD_DASHA_RISE_001
  system: Parashari/Vimshottari
  dasha: Vimshottari
  category: general
  condition:
    all:
      - path: parashari_vimshottari.dasha_lord_facts.owned_houses
        operator: equals
        value: 1
      - path: chart_facts.varga.charts.d1.all_lord_placements.1_lord.dignity
        operator: in
        value: [exalted, own_sign]
  reason: Active Vimshottari dasha lord is the Lagna lord and the D1 Lagna lord is strong.
  interpretation: When the ascendant lord is strong, its dasha supports vitality, initiative, rise, and the ability to carry promised results.
  outcomes:
    promotion_score: 2
    authority_score: 2
    income_growth_score: 1
    business_success_score: 1
    long_term_sustainability_score: 1
    risk_score: -1
    delay_score: -1
  weight: 7
  polarity: positive
  confidence: medium
  source_book: "Hindu Predictive Astrology - B. V. Raman"
  source_chapter: "Chapter XXIV: Results of Dasas and Bhuktis"
  source_page: "pp. 140-143"

- rule_id: VIMSHOTTARI_CH24_SECOND_LORD_WEALTH_001
