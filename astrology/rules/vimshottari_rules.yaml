  source_chapter: "Chapter XXIV: Results of Dasas and Bhuktis"
  source_page: "pp. 142-143"

- rule_id: VIMSHOTTARI_CH24_TRANSIT_MODIFIES_DASHA_001
  system: Parashari/Vimshottari
  dasha: Vimshottari
  category: general
  condition:
    path: transits.status
    operator: exists
    value: true
  reason: Transit context is available to modify dasha judgment.
  interpretation: Dasha results should be moderated by gochara/transit support or pressure rather than judged from the dasha alone.
  outcomes:
    delay_score: 0
  weight: 1
  polarity: mixed
  confidence: high
  source_book: "Hindu Predictive Astrology - B. V. Raman"
  source_chapter: "Chapter XXIV: Results of Dasas and Bhuktis"
  source_page: "p. 142"
