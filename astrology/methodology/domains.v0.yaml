    known_gaps: [Compatibility between two charts (kundli matching) is calculation_unavailable]

  relationships:
    label: Romantic relationships, love and non-marital partnership
    distinct_from: [marriage]
    examples: ["Will this relationship last?", "When will I meet someone?"]
