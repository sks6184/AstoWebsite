      - Venus and Jupiter in D1 and D9
      - 7th house and 7th lord in D9 (Navamsha)
      - Darakaraka and Upapada (via get_jaimini_facts)
      - current and coming Mahadasha and sub-period lords connected to the 7th, Venus or DK
