    vargas: [d1, d10]                                                # [app]
    jaimini_points: [amatyakaraka, arudha_lagna]                     # [draft]
    dasha_systems: [vimshottari, chara, yogini]
    core_factors:
      - 7th and 10th houses and lords; 11th for gains; 2nd for capital
      - Mercury's condition
      - Rahu, when online, technology or foreign markets are involved (AGENTS.md)
      - current Mahadasha and sub-period
      - deterministic business rules
    optional_factors: [D10 business indications, transits for launch timing (preliminary-muhurta disclosure applies)]
    vocabulary:
      - {term: business, mentions: 379}
      - {term: partnership, mentions: 19}
      - {term: trade, mentions: 18}
      - {term: gains, mentions: 524}
      - {term: 7th house, mentions: 129}
    sensitivity: none
    known_gaps: [Launch-date questions need muhurta, which is calculation_unavailable]

