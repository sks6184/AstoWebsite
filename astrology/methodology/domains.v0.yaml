# AstroGPT domain investigation guidance, v0. DRAFT FOR OWNER ASTROLOGICAL REVIEW (OD-24).
#
# Status: not loaded by any code yet. M3 implementation has not started.
#
# What this file is:
#   - Guidance on WHAT to examine for each life domain.
#   - It is not a tool sequence and not a set of interpretations (owner amendment 1, 2026-11-11).
#   - The agent chooses its own tools and order.
#   - The agent may request any other authorized tool or source the question needs, within the
#     budget and authorization limits.
#   - Nothing here decides whether a rule applies (G-8) or what an outcome means (G-6).
#
# Provenance of each field:
#   [app]   copied from chat/prediction_context.py::CATEGORY_RULES (what the app already uses)
#   [draft] proposed by Claude from standard Parashari/Jaimini conventions; needs your review
#   [m2]    taken from offline term counts over the local book texts (2026-11-11)
#
# Vocabulary hints:
#   - At most 8 per domain. They are search-wording hints the model may use, never a replacement table.
#   - Each hint carries its mention count across the local book texts, where counted (approximate:
#     the counts include a superseded copy of Bhrigu Samhita).
#
# core_factors:
#   - Factors the agent should examine, or explicitly report as unavailable, before publishing.
#   - Order and tools are the agent's choice. The validator checks only that each factor was
#     examined or disclosed.
#
# Review checklist for the owner: houses, karakas, vargas, Jaimini points, the distinctions between
# domains, core_factors, sensitivity notes and known gaps. Mark changes inline; nothing is used until approved.

schema_version: 0
status: draft_pending_owner_review
date: '2026-11-11'

principles:
  - Guidance, not a script. Examine the core factors, then follow the evidence; request further tools or sources when needed.
  - Facts come only from tools. Interpretation is written by the model from those facts and retrieved sources.
  - State unavailable calculations (calculation_unavailable), failed searches (retrieval_failed) and absent source support (no_source_support) separately.
  - Mixed questions combine the guidance of every labelled domain. Do not answer one domain and drop the other.
  - Agreement between systems is agreement of indicators, not proof. State conflicting indications.

# Shared tool vocabulary (the authorized tools, not a sequence):
#   get_chart_facts (vargas, lords, yogas), get_dasha_periods (vimshottari | yogini | chara),
#   get_transits, get_ashtakavarga, evaluate_astrology_rules (category), get_timing_candidates,
#   get_jaimini_facts (new wrapper), search_astrology_knowledge.

common_vocabulary:   # [m2] used across domains
  - {term: sub-period, mentions: 129, note: preferred over antardasha (8) in these books}
  - {term: Mahadasha, mentions: 44}
  - {term: Navamsha, mentions: 547, note: preferred over Navamsa (86)}
  - {term: Lagna lord, mentions: 262}
  - {term: Yogini, mentions: 198}
  - {term: Chara Dasha, mentions: 106}
  - {term: Pada, mentions: 61, note: the Chara Dasha book says Pada, not Arudha Lagna}
  - {term: Xth House, note: Bhrigu Samhita headings use Roman numerals, e.g. "Saturn in the Xth House"}

domains:

  career:
    label: Career, job and profession
    distinct_from: [business]
    examples: ["Will I get a promotion next year?", "Is a job change favourable?"]
    rule_categories: [career, job]                                   # [app]
    houses: {primary: [10], supporting: [2, 6, 11]}                  # [app]
    natural_karakas: [Su, Me, Sa]                                    # [app]
    vargas: [d1, d10]                                                # [app]
    jaimini_points: [amatyakaraka, arudha_lagna, 10th_from_arudha_lagna]   # [draft]
    dasha_systems: [vimshottari, chara, yogini]                      # [draft]
    core_factors:                                                    # [draft]
      - 10th house, its lord and occupants in D1
      - 10th lord and Lagna in D10
      - current Vimshottari Mahadasha and sub-period lords in relation to houses 10, 6, 2 and 11
      - Amatyakaraka and the Pada of the Lagna
      - deterministic career rules for the question date
    optional_factors: [Chara Dasha sign and its relation to AmK, Yogini period, Saturn and Jupiter transits over the 10th or its lord, SAV of the 10th]
    vocabulary:                                                      # [m2]
      - {term: 10th lord, mentions: 111}
      - {term: Dashamsha, mentions: 83}
      - {term: AmK, mentions: 86}
      - {term: profession, mentions: 117}
      - {term: Raja yoga, mentions: 53}
      - {term: karma, mentions: 45}
    sensitivity: none
    known_gaps: [M2 weak retrieval for Chara Dasha career timing and for Saturn's influence on the 10th]
    note: Detailed career methodology is the M4 benchmark.

  business:
