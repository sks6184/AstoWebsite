    dasha_systems: [vimshottari, chara, yogini]
    core_factors:
      - 10th house, its lord and occupants in D1, and the 10th lord in D10
      - houses 1, 5, 6, 8 and 11 and their lords as they relate to the 10th; the 12th only when the conditional case applies
      - "8th-lord influence on the 10th house or 10th lord (placement, conjunction or Parashari aspect): an investigation factor only, never an automatic job-loss verdict [owner]"
      - Mahadasha and sub-period lords over the requested window and their links to the career houses
      - Amatyakaraka and the 10th from AL
      - deterministic career rules evaluated for the window
    event_guides:                                                    # [owner] C1 and C5; investigation only
      promotion: {focus: "10th and 11th, their lords, the Sun (authority), D10 Lagna and 10th lord; periods and transits in the window", note: Distinguish advancement within the same employer from a change of employer.}
      voluntary_employer_change: {focus: "10th and its lord, plus the 6th (service) and 12th (leaving) when a move is initiated; whether periods link the 10th with 6/12", note: The user chooses to move; do not treat it as a loss.}
      lateral_change: {focus: "6th and 10th; a change of role or employer at a similar level; Mercury and Saturn", note: A move without clear rise or fall; avoid framing it as promotion or setback.}
      involuntary_disruptive_change: {focus: "8th-lord and 8th-house influence on the 10th, the 6th, Saturn and Rahu in the window, and protective or mitigating factors", note: "Report disruption indicators as possibilities to compare; state mitigating evidence; no verdict of job loss."}
      foreign_relocation: {focus: "12th, 9th and 4th alongside the 10th; Rahu; combines with the foreign_settlement guidance", note: A mixed career and foreign question.}
      unemployment_and_reemployment: {focus: "the 6th and 10th and their lords for the gap; the 2nd and 11th lords for the return of income; periods across the window", note: "Present a gap and a return as indicators to compare; no verdict on how long unemployment lasts.", basis_note: "[matrix] Graded B for a KP-style grouping, otherwise C; provisional."}   # [matrix, M3-8]
      leadership_and_senior_management: {focus: "the 10th and Lagna and their lords; kendra-trikona lord connections (raja yoga) where detected; the Sun; D10 and D9", note: "Raja yoga indicates status in the classical texts; mapping it to corporate rank is interpretation.", basis_note: "[matrix] A for the raja-yoga promise; C for the corporate mapping; provisional."}   # [matrix, M3-8]
    optional_factors: [Chara Dasha signs in relation to the AmK and AL, Yogini periods, Saturn and Jupiter transits over the 10th or its lord with SAV, the D10 rules]
