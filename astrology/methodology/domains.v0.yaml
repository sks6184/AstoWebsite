# AstroGPT domain investigation guidance, v0 (revision 3). Owner-approved for offline M3 implementation (2026-11-11).
#
# Status: loaded by astrology/methodology/profile.py for the M3 general agent (offline; no live use yet).
# Revision 2 applied the owner's methodology corrections C1-C12. Revision 3 applies the owner-approved
# event-matrix refinements M3-1 and M3-4 to M3-8, and the tools OD-31, OD-32 and OD-33
# (see docs/claude_migration/M3_EVENT_MATRIX_COMPARISON.md).
# [matrix] = from the preliminary research matrix (docs/research/); provisional, references UNVERIFIED.
# Every substantive change is listed in docs/claude_migration/M3_DOMAIN_PROFILE_CHANGES.md.
#
# What this file is:
#   - Guidance on WHAT to examine. It is not a prediction engine, a tool sequence or a set of
#     interpretations.
#   - The agent chooses its own tools and order, and may request any other authorized tool or source.
#   - Nothing here decides whether a rule applies (G-8) or what an outcome means (G-6).
#
# Provenance tags:
#   [app]   the app's existing chat/prediction_context.py::CATEGORY_RULES
#   [owner] the owner's corrections of 2026-11-11
#   [draft] proposed by Claude from standard conventions; still needs owner review
#   [code]  documents what the existing calculation code actually does
#   [m2]    offline term counts over the local book texts (approximate)
#
# core_factors: examine each one, or disclose it as unavailable, before publishing a predictive or
#   assessment answer. The validator checks only coverage; it never checks a conclusion.
# event_guides: extra evidence to collect for a specific kind of event inside a domain. They guide
#   investigation only and prescribe no conclusion (C5).

schema_version: 0
revision: 3
status: owner_approved_for_offline_m3
date: '2026-11-11'

principles:
  - Guidance, not a script. Examine the relevant factors, follow the evidence, and request further tools or sources when the question needs them.
  - Facts come only from tools. Interpretation is written by the model from those facts and from retrieved sources.
  - State unavailable calculations (calculation_unavailable), failed searches (retrieval_failed) and absent source support (no_source_support) separately. Never fabricate a missing calculation.
  - Mixed questions combine the guidance of every labelled domain and event.
  - Agreement between systems is agreement of indicators, not proof. State conflicting indications.
  - Investigate the actual question asked. Identify the event subtype before choosing evidence (C9).
  - Derived-house reasoning (bhavat bhavam, for example "the 12th from the 10th") is permitted when it is labelled as derived and is never the sole basis of a conclusion. Schools disagree on some derivations; say so. [matrix, owner-approved M3-6]
  - KP (Krishnamurti Paddhati) is not computed: the app has no KP cusps or sub-lords. Never apply KP house groupings to the app's whole-sign houses. [owner M3-6]
  - Parashari planetary aspects (get_natal_aspects) and Jaimini rasi drishti (get_jaimini_facts) are different systems. Never mix or substitute them. [owner]
  - Attestation notes (basis_note) describe provisional textual attribution only, not predictive reliability. The absence of a classical rule in the current research does not show that none exists. [owner M3-5]

# ── C4: question-type-aware investigation ────────────────────────────────────
question_types:
  factual_lookup:
    description: A single calculated fact, such as a house lord, a placement or the running period.
    investigation: Answer from the one relevant tool result. Apply no domain checklist, no rules, no retrieval and no timing.
    examples: ["Who is my 7th lord?", "Where is Saturn in D10?", "Which Mahadasha am I running?"]
    llm_rounds: 0 where the deterministic shortcut applies
  concept_explanation:
    description: Explaining a technique or term, not about the user's chart.
    investigation: Retrieval and explanation. Chart tools only if the user asks how the concept applies to them.
    examples: ["What is Upapada?", "How does Chara Dasha work?"]
  natal_assessment:
    description: The general promise of a life area, without a time frame.
    investigation: The domain's core natal factors and relevant rules. Dasha and transit timing only if the answer would otherwise mislead.
    examples: ["What does my chart say about my career?"]
  predictive_timing:
    description: Whether, or when, something happens within a period.
    investigation: The core natal factors, plus dashas and transits for the requested window (see timing_principles). Include rules evaluated for the window.
    examples: ["Will I change jobs next year?", "When will I marry?"]
  comparative_decision:
    description: Choosing between options, places or periods.
    investigation: The same evidence gathered for each option or period and compared side by side, with conflicts stated. No option is preferred without evidence.
    examples: ["Should I buy property in India or abroad?", "Is March or June better for a job move?"]

# ── C2: requested dates, not only the current period ─────────────────────────
timing_principles:
  - For predictive questions, request dasha periods for the user's requested window (get_dasha_periods start_date and end_date), not only the running Mahadasha and sub-period.
  - Request transits for the same window (get_transits over the requested dates). Transit rows are daily noon-UTC samples, not exact ingress times.
  - If the user gives no window, use a stated default (proposed: today to 12 months ahead) and tell the user the window that was used. [draft]
  - Use "the current period" only when the question is about now.
  - Activation (M3-1): within the window, examine the dasha periods of the lords of the relevant houses, the planets occupying them, the planets aspecting them (Parashari aspects via get_natal_aspects) and the relevant karakas. This is an investigation principle, not a rule that decides an outcome. [matrix, cited to BPHS Ch.47-48 and PD Ch.20 (UNVERIFIED), owner-approved]
  - Where a window spans several sub-periods, examine each relevant sub-period rather than averaging them.
  - Exact event-date or muhurta selection is calculation_unavailable. Timing is given as windows with the AGENTS.md preliminary-timing disclosure.

# ── C3: transits and SAV ─────────────────────────────────────────────────────
transit_sav_principle:
  - A relevant transit planet is evaluated against the natal SAV points of the sign it transits. The transit tool returns these as sarvashtakavarga_points for each sampled sign. [code]
  - Transit houses are reported from both the natal Lagna (transit_house_from_lagna) and the natal Moon (transit_house_from_moon, OD-33). Name which reference is used. [owner OD-33]
  - The legacy transit field can_deliver_owned_or_placed_house_results (SAV above 28) is a heuristic flag, not an outcome, and is not published as one. [code + owner C3]
  - High SAV can strengthen the manifestation of the planet's existing significations in that context. It does not by itself establish a favourable outcome. [owner]
  - Low SAV can weaken or strain the planet's significations. It does not by itself establish an unfavourable outcome. [draft, mirroring the owner's principle]
  - SAV qualifies a transit. It never replaces the natal promise or the dasha. A transit is timing confirmation, not the sole basis of a prediction (AGENTS.md).

# ── C10: Jaimini calculation conventions (documents existing code) ───────────
jaimini_conventions:   # [code] unless marked
  chara_karakas:
    scheme: 7 karakas (Atma, Amatya, Bhratru, Matru, Putra, Gnati, Dara), Sun to Saturn; Rahu and Ketu excluded (owner decision, M1b)
    ranking: Planets ordered by degrees travelled within their sign (sidereal longitude modulo 30), highest first; Atmakaraka is the highest
    zodiac: Lahiri sidereal, geometric positions (method profile lahiri.geometric.truenode.wholesign.v2)
    tie_handling: none; exact ties are not specially resolved (UNVERIFIED as a source rule)
    source: charts/astro_engine.py::_assign_jaimini_karakas
  sign_aspects_rasi_drishti:
    rule: Movable signs aspect the fixed signs except the adjacent one; fixed signs aspect the movable signs except the adjacent one; dual signs aspect the other dual signs
    planet_influence_on_sign: a planet influences a sign by occupying it or by rasi drishti from its own sign
    source: astrology/calculations/jaimini.py::jaimini_aspected_signs
  house_padas:
    coverage: All 12 house padas (A1 to A12). Count from the house to its lord, then the same distance again from the lord.
    exceptions: Not applied. The classical exceptions (a pada falling in the 1st or 7th from its house) are not used, following the source's instruction to ignore the disputed exceptions.
    named_padas: AL (Arudha Lagna) = A1; Darapada = A7; UL (Upapada Lagna) = A12
    source: astrology/calculations/jaimini.py::build_padas
  planetary_padas:
    status: calculation_unavailable
    reason: Deferred in code. The reviewed source chapter says planetary padas should be calculated but gives no sufficiently explicit formula.
    difference_from_house_padas: House padas are arudhas of houses (counted from a house to its lord). Planetary padas would be arudhas of planets (counted from a planet to the signs it rules). Only the house padas are computed.
  karakamsha:
    definition: The Navamsha (D9) sign occupied by the Atmakaraka
    derived_points_available: 5th, 9th and 10th from Karakamsha. Their occupants and the planets influencing them are read in the D1 (Rasi) chart.
    derived_points_counted: Any n-th sign (1-12) from Karakamsha via get_counted_sign (OD-31), with the same D1 reading of occupants and rasi-drishti influences
    source: astrology/calculations/jaimini.py::build_karakamsha
  arudha_derived_points:
    available: 2nd, 10th and 11th from AL (occupants and influencing planets); UL and Darapada as relationship references
    counted: Any n-th sign (1-12) from AL or UL via get_counted_sign (OD-31)
  chara_dasha:
    school: K.N. Rao, as declared from "Predicting Through Jaimini's Chara Dasha"; not independently verified (UNVERIFIED)
    year: 365.2425 days (owner kept the existing Chara convention in M1b)
    source: charts/jaimini.py::build_chara_dasha

parashari_aspect_convention:   # [code], not yet exposed to the agent
  rule: Every planet has the full 7th aspect; Mars also 4th and 8th; Jupiter 5th and 9th; Saturn 3rd and 10th; Rahu and Ketu 7th only
  source: charts/vedic_utils.py::PLANET_ASPECTS, natal_planet_aspects_on_house
  status: Exposed read-only via get_natal_aspects (OD-32, owner-approved). Kept separate from Jaimini rasi drishti.

