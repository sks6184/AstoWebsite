{% extends "base.html" %}
{% load socialaccount %}

{% block title %}Login - Astrology GPT{% endblock %}

{% block content %}
<section class="panel narrow">
  <h1>Login</h1>
  {% if google_login_enabled %}
    <a class="button google-login" href="{% provider_login_url 'google' %}">Continue with Google</a>
    <div class="login-divider">or</div>
  {% endif %}
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="button" type="submit">Login</button>
  </form>
</section>
{% endblock %}
